<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7efe9"/><stop offset="1" stop-color="#cddbd4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2cfc9"/><stop offset="1" stop-color="#9fb0a8"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c2a39"/><stop offset="1" stop-color="#16384a"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="42%" r="75%">
      <stop offset="55%" stop-color="#0a1714" stop-opacity="0"/><stop offset="100%" stop-color="#08120f" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="floorglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0a1c17" stop-opacity="0.55"/>
    </linearGradient>
    <symbol id="bed" viewBox="0 0 300 170">
      <ellipse cx="150" cy="158" rx="142" ry="12" fill="#0a1714" opacity="0.16"/>
      <rect x="13" y="38" width="17" height="90" rx="7" fill="#8b989e"/>
      <rect x="270" y="62" width="16" height="66" rx="7" fill="#8b989e"/>
      <rect x="20" y="92" width="262" height="20" rx="9" fill="#aab6bb"/>
      <rect x="26" y="73" width="250" height="27" rx="13" fill="#3f8f85"/>
      <rect x="26" y="73" width="250" height="10" rx="6" fill="#4fa597"/>
      <rect x="38" y="60" width="66" height="27" rx="12" fill="#f1f5f3" transform="rotate(-4 71 73)"/>
      <rect x="44" y="112" width="8" height="34" fill="#7e8c92"/>
      <rect x="248" y="112" width="8" height="34" fill="#7e8c92"/>
      <circle cx="48" cy="150" r="9" fill="#39444a"/><circle cx="252" cy="150" r="9" fill="#39444a"/>
    </symbol>
  </defs>

  <!-- room -->
  <rect width="1600" height="560" fill="url(#wall)"/>
  <rect y="560" width="1600" height="340" fill="url(#floor)"/>
  <!-- floor seams (gentle perspective) -->
  <g stroke="#8ea29a" stroke-width="2" opacity="0.35">
    <path d="M0 640 L1600 640"/><path d="M0 740 L1600 740"/>
    <path d="M520 560 L300 900"/><path d="M1080 560 L1300 900"/>
  </g>

  <!-- night windows -->
  <g>
    <rect x="560" y="120" width="480" height="250" rx="10" fill="url(#night)" stroke="#bcc9c3" stroke-width="8"/>
    <line x1="800" y1="120" x2="800" y2="370" stroke="#bcc9c3" stroke-width="6"/>
    <line x1="560" y1="245" x2="1040" y2="245" stroke="#bcc9c3" stroke-width="6"/>
    <circle cx="950" cy="190" r="26" fill="#dfeaee" opacity="0.85"/>
    <g fill="#cfe0e6"><circle cx="640" cy="180" r="2.5"/><circle cx="700" cy="300" r="2"/><circle cx="880" cy="320" r="2.5"/><circle cx="1000" cy="290" r="2"/></g>
  </g>

  <!-- wall clock: late night -->
  <g transform="translate(1320,200)">
    <circle r="46" fill="#fff" stroke="#aebab4" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#33403b" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="6" stroke="#33403b" stroke-width="4" stroke-linecap="round"/>
    <circle r="4" fill="#33403b"/>
  </g>

  <!-- IV stand -->
  <g transform="translate(250,470)">
    <rect x="-3" y="0" width="6" height="180" fill="#8a979c"/>
    <rect x="-26" y="14" width="52" height="34" rx="8" fill="#cfe8df" stroke="#9fb8ad" stroke-width="2"/>
    <circle cx="0" cy="186" r="10" fill="#5b6a6f"/>
  </g>

  <!-- empty beds (all unoccupied) -->
  <use href="#bed" x="120" y="560" width="360" height="204"/>
  <use href="#bed" x="620" y="560" width="360" height="204"/>
  <use href="#bed" x="1120" y="560" width="360" height="204"/>

  <!-- grade + vignette for text overlay -->
  <rect width="1600" height="900" fill="url(#floorglow)"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
