<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04130d"/><stop offset="0.6" stop-color="#072a1c"/><stop offset="1" stop-color="#0a3322"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10211b"/><stop offset="1" stop-color="#020806"/>
    </linearGradient>
    <radialGradient id="red" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a5a" stop-opacity="0.9"/><stop offset="1" stop-color="#ff5a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig2" cx="50%" cy="45%" r="75%">
      <stop offset="55%" stop-color="#020806" stop-opacity="0"/><stop offset="100%" stop-color="#020806" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#bfe6d4" opacity="0.5"><circle cx="200" cy="120" r="2"/><circle cx="420" cy="80" r="1.5"/><circle cx="1300" cy="100" r="2"/><circle cx="1500" cy="160" r="1.5"/><circle cx="900" cy="70" r="1.5"/></g>

  <!-- faint city skyline -->
  <g fill="#06231a" opacity="0.9">
    <rect x="0" y="380" width="120" height="220"/><rect x="140" y="320" width="90" height="280"/>
    <rect x="250" y="420" width="110" height="180"/><rect x="1240" y="340" width="100" height="260"/>
    <rect x="1360" y="400" width="90" height="200"/><rect x="1470" y="350" width="130" height="250"/>
  </g>
  <!-- hospital tower with cross (distant) -->
  <g><rect x="1100" y="300" width="110" height="300" fill="#08311f"/><circle cx="1155" cy="340" r="20" fill="#0F7A45"/><path d="M1145 340h20M1155 330v20" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g>

  <!-- road -->
  <rect y="600" width="1600" height="300" fill="url(#road)"/>
  <path d="M740 600 L640 900 H960 L860 600 Z" fill="#16302a" opacity="0.5"/>
  <g fill="#c9b24a" opacity="0.85"><rect x="792" y="640" width="16" height="40"/><rect x="788" y="720" width="24" height="56"/><rect x="782" y="820" width="36" height="70"/></g>

  <!-- red glow on road behind ambulance -->
  <ellipse cx="900" cy="640" rx="260" ry="120" fill="url(#red)" opacity="0.5"/>

  <!-- ambulance (rear 3/4, driving away) -->
  <g transform="translate(720,470)">
    <rect x="0" y="40" width="250" height="150" rx="14" fill="#f4f7f6"/>
    <rect x="0" y="40" width="250" height="34" rx="14" fill="#e2e8e5"/>
    <rect x="14" y="92" width="222" height="10" fill="#D32F2F"/>
    <rect x="84" y="116" width="82" height="58" rx="6" fill="#0F7A45"/>
    <path d="M118 130h14M125 123v28" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <rect x="96" y="22" width="58" height="22" rx="6" fill="#b9302f"/>
    <circle cx="110" cy="33" r="7" fill="#ff5a5a"/><circle cx="142" cy="33" r="7" fill="#5ab6ff"/>
    <circle cx="40" cy="196" r="22" fill="#1d2622"/><circle cx="210" cy="196" r="22" fill="#1d2622"/>
    <circle cx="28" cy="150" r="9" fill="#D32F2F"/><circle cx="222" cy="150" r="9" fill="#D32F2F"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig2)"/>
</svg>
